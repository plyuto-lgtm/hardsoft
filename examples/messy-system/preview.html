<style>
	* { box-sizing: border-box; margin: 0; }
	:root { --text: #111; --quiet: #6b6b6b; --line: #e8e8e8; --page: #fff; --panel: #f5f5f5; }
	html { font: 14px/20px system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
	body { background: var(--page); color: var(--text); padding: 40px 24px 96px; }
	main { max-width: 1120px; margin: 0 auto; display: grid; gap: 64px; }
	h1 { font-size: 20px; line-height: 28px; font-weight: 500; }
	h2 { font-size: 20px; line-height: 28px; font-weight: 500; margin-bottom: 4px; }
	h3 { font-size: 14px; line-height: 20px; font-weight: 500; }
	.quiet { color: var(--quiet); }
	.small { font-size: 12px; line-height: 16px; }
	.head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 20px; }

	/* The three proofs */
	.proofs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
	.proof { background: var(--panel); border-radius: 16px; padding: 20px; display: grid; gap: 16px; align-content: space-between; min-height: 176px; }
	.figure { font-size: 48px; line-height: 52px; font-weight: 500; letter-spacing: -0.03em; }
	.figure s { text-decoration: none; color: #b0b0b0; }
	.dots { display: flex; flex-wrap: wrap; gap: 4px; }
	.dot { width: 24px; height: 24px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.08); }

	/* The screen, before and after */
	.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
	.tab { font: inherit; border: 0; height: 32px; padding: 0 12px; border-radius: 8px; background: none; color: var(--quiet); cursor: pointer; }
	.tab[aria-pressed='true'] { background: var(--panel); color: var(--text); }
	.compare { position: relative; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); line-height: 0; user-select: none; }
	.compare img { display: block; width: 100%; }
	.compare .old { position: absolute; inset: 0; overflow: hidden; width: var(--at, 50%); border-right: 1px solid #fff; box-shadow: 1px 0 0 rgb(0 0 0 / 0.3); }
	.compare .old img { width: auto; height: 100%; max-width: none; }
	.compare input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
	.compare .tag { position: absolute; top: 12px; padding: 4px 8px; border-radius: 6px; background: rgb(0 0 0 / 0.72); color: #fff; font-size: 12px; line-height: 16px; pointer-events: none; }
	.compare .tag.was { left: 12px; }
	.compare .tag.now { right: 12px; }

	/* What replaces what */
	.swap { display: grid; grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr); gap: 16px; align-items: start; padding: 20px 0; border-top: 1px solid var(--line); }
	.swap .arrow { color: var(--quiet); text-align: center; line-height: 32px; }
	.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
	.chip { width: 32px; height: 32px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.08); position: relative; overflow: hidden; }
	.chip.step { width: 40px; display: grid; place-items: end center; font-size: 10px; line-height: 14px; }
	/* The checkerboard under a transparent color, at 20%, so the color still reads */
	.checker { background-image: conic-gradient(rgb(128 128 128 / 0.2) 25%, transparent 0 50%, rgb(128 128 128 / 0.2) 0 75%, transparent 0); background-size: 8px 8px; }
	.chip i, .mark i { position: absolute; inset: 0; }
	.chip span { position: relative; padding: 0 3px; border-radius: 3px; background: rgb(255 255 255 / 0.85); margin-bottom: 2px; }

	/* Every color */
	.filters { display: flex; flex-wrap: wrap; gap: 4px; }
	.group { border-top: 1px solid var(--line); padding: 20px 0 8px; }
	.group > header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
	.rows { display: grid; gap: 6px; }
	.row { display: grid; grid-template-columns: 200px minmax(0, 1fr) minmax(0, 1fr) 220px; gap: 12px; align-items: center; }
	.row.one { grid-template-columns: 200px minmax(0, 1fr) 220px; }
	.row.labels { color: var(--quiet); font-size: 12px; line-height: 16px; }
	.name { overflow-wrap: anywhere; }
	/* A bar is a piece of the theme's ground with the color on it, so dark reads as dark */
	.bar { padding: 6px 8px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); }
	.bar > div { display: grid; grid-template-columns: 1fr 1fr; height: 28px; border-radius: 6px; overflow: hidden; }
	.bar > div > div { position: relative; }
	.bar i { position: absolute; inset: 0; }
	.now { display: flex; align-items: center; gap: 8px; min-width: 0; }
	.mark { flex: none; width: 16px; height: 16px; border-radius: 4px; position: relative; overflow: hidden; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.1); }
	.moved { color: #a15c00; }
	[hidden] { display: none !important; }
	@media (max-width: 800px) {
		.row, .row.one { grid-template-columns: 1fr 1fr; }
		.row .name, .row .now { grid-column: 1 / -1; }
		.row.labels { display: none; }
		.swap { grid-template-columns: 1fr; }
		.swap .arrow { display: none; }
	}
</style>

<body>
<main id="page"></main>
<script>
const el = (tag, props = {}, children = []) => {
	const node = Object.assign(document.createElement(tag), props);
	node.append(...[].concat(children).filter((c) => c !== null && c !== undefined));
	return node;
};
const layer = (color, step) => `color-mix(in srgb, ${color} ${step}%, transparent)`;
const paint = (node, ground, color) => {
	node.style.backgroundColor = ground;
	const i = el('i');
	i.style.background = color;
	node.append(i);
	return node;
};
const tokens = system.tokens;
const themes = ['light', ...(system.dark ? ['dark'] : [])];
const soft = tokens.filter((t) => t.kind === 'soft');
const solid = tokens.filter((t) => t.kind !== 'soft');
const masters = tokens.filter((t) => t.kind === 'master');
const moved = soft.filter((t) => t.shift > system.fit);
const WORDS = { master: 'Key color, unchanged', kept: 'Unchanged', hard: 'Unchanged, solid on a hard surface', untouched: 'Unchanged' };

// What a token was and is in one theme: { ground, was, now, shift }.
function look(t, theme) {
	const dark = theme === 'dark';
	const ground = dark ? (t.dark?.on ?? system.dark.ground) : t.on;
	const was = dark ? t.dark?.value : t.value;
	if (t.kind !== 'soft') return { ground, was: was ?? t.value, now: was ?? t.value, fresh: dark && !t.dark };
	const master = dark ? (t.dark?.masterValue ?? (t.masterValue === system.light.ink ? system.dark.ink : t.masterValue)) : t.masterValue;
	return { ground, was, now: layer(master, t.step), shift: dark ? t.dark?.shift : t.shift, fresh: dark && !t.dark };
}

function bar(t, theme) {
	const l = look(t, theme);
	const box = el('div');
	if (l.was && !l.fresh) box.append(paint(el('div'), l.ground, l.was));
	const after = paint(el('div', { className: t.kind === 'soft' ? 'checker' : '' }), l.ground, l.now);
	if (!l.was || l.fresh) after.style.gridColumn = '1 / -1';
	box.append(after);
	const wrap = el('div', { className: 'bar' }, [box]);
	wrap.style.background = system[theme].ground;
	box.title = l.fresh ? `${theme}: no value today` : `${theme}: was ${l.was}${l.shift !== undefined ? `, shift ${l.shift}` : ''}`;
	return wrap;
}

const page = document.getElementById('page');
page.append(el('header', { className: 'head' }, [el('h1', { textContent: system.name }), el('span', { className: 'quiet', textContent: 'hardsoft preview' })]));

// 1. The three proofs: fewer values, the key colors stay, it looks the same.
const figure = (big, label, extra) => el('div', { className: 'proof' }, [el('div', {}, [el('div', { className: 'figure' }, big), el('div', { className: 'quiet', textContent: label })]), extra]);
const dots = (list) => el('div', { className: 'dots' }, list.map((t) => { const d = el('div', { className: 'dot', title: t.name }); d.style.background = t.value; return d; }));
const proofs = el('section', { className: 'proofs' }, [
	figure([el('s', { textContent: `${tokens.length} ` }), `${solid.length}`], 'Colors with a value of their own', el('div', { className: 'quiet small', textContent: `${soft.length} of them are now a key color at a transparency.` })),
	figure([`${solid.length}`], 'Colors that stay exactly as they are', dots(solid)),
	figure([`${soft.length - moved.length}`, el('s', { textContent: ` of ${soft.length}` })], 'Replaced colors that look the same', el('div', { className: 'quiet small', textContent: moved.length ? `${moved.length} move a little: ${moved.map((t) => t.name).join(', ')}.` : 'None of them moves.' })),
]);
if (system.dark) {
	const had = tokens.filter((t) => t.dark);
	const need = had.filter((t) => t.kind !== 'soft' || t.dark.shift > system.fit + 1);
	proofs.append(figure([el('s', { textContent: `${had.length} ` }), `${need.length}`], 'Values the dark theme needs', el('div', { className: 'quiet small', textContent: 'Dark uses the same tokens. Only the key colors change.' })));
}
page.append(proofs);

// 2. The real screens, before and after.
if (system.screens.length) {
	const view = el('div');
	const show = (s) => {
		const range = el('input', { type: 'range', min: 0, max: 100, value: 50, ariaLabel: 'Before and after' });
		const old = el('div', { className: 'old' }, [el('img', { src: s.before, alt: `${s.name}, before` })]);
		const box = el('div', { className: 'compare' }, [el('img', { src: s.after, alt: `${s.name}, after` }), old, el('span', { className: 'tag was', textContent: 'Today' }), el('span', { className: 'tag now', textContent: 'With hardsoft' }), range]);
		range.oninput = () => box.style.setProperty('--at', `${range.value}%`);
		view.replaceChildren(box);
	};
	const tabs = el('div', { className: 'tabs' }, system.screens.map((s, i) => {
		const b = el('button', { className: 'tab', textContent: s.name, ariaPressed: String(i === 0) });
		b.onclick = () => { tabs.querySelectorAll('.tab').forEach((x) => (x.ariaPressed = String(x === b))); show(s); };
		return b;
	}));
	show(system.screens[0]);
	page.append(el('section', {}, [el('div', { className: 'head' }, [el('div', {}, [el('h2', { textContent: 'Your screens' }), el('p', { className: 'quiet', textContent: 'Drag to compare.' })]), tabs]), view]));
}

// 3. What replaces what: many solid colors on the left, one key color and its steps on the right.
const used = [...new Set(soft.map((t) => t.master))];
if (used.length) {
	const section = el('section', {}, [el('h2', { textContent: 'What replaces what' }), el('p', { className: 'quiet', style: 'margin-bottom: 20px', textContent: 'The checkered squares are transparent.' })]);
	for (const name of used) {
		const mine = soft.filter((t) => t.master === name);
		const steps = [...new Set(mine.map((t) => t.step))].sort((a, b) => a - b);
		const value = mine[0].masterValue;
		const olds = el('div', { className: 'chips' }, mine.map((t) => { const c = el('div', { className: 'chip', title: `${t.name} ${t.value}` }); paint(c, t.on, t.value); return c; }));
		const key = el('div', { className: 'chip', title: `${name} ${value}` });
		key.style.background = value;
		const news = el('div', { className: 'chips' }, [key, ...steps.map((s) => { const c = el('div', { className: 'chip step checker', title: `${name} at ${s}%` }); c.style.backgroundColor = '#fff'; const i = el('i'); i.style.background = layer(value, s); c.append(i, el('span', { textContent: s })); return c; })]);
		section.append(el('div', { className: 'swap' }, [
			el('div', {}, [el('h3', { textContent: `${mine.length} ${mine.length === 1 ? 'color' : 'colors'}` }), olds]),
			el('div', { className: 'arrow', textContent: '→' }),
			el('div', {}, [el('h3', { textContent: `${name} at ${steps.length} ${steps.length === 1 ? 'step' : 'steps'}` }), news]),
		]));
	}
	page.append(section);
}

// 4. Every color of the system, grouped the way the system groups them.
const groups = [...new Set(tokens.map((t) => t.group))];
const list = el('div');
const one = themes.length === 1 ? ' one' : '';
for (const g of groups) {
	const mine = tokens.filter((t) => t.group === g);
	const left = mine.filter((t) => t.kind !== 'soft').length;
	const rows = el('div', { className: 'rows' }, [
		el('div', { className: `row labels${one}` }, [el('span'), ...themes.map((th) => el('span', { textContent: themes.length > 1 ? `On the ${th} ground: today, with hardsoft` : 'Today, with hardsoft' })), el('span')]),
		...mine.map((t) => {
			const now = el('div', { className: 'now small' });
			if (t.kind === 'soft') {
				const far = t.shift > system.fit || (t.dark?.shift ?? 0) > system.fit;
				now.append(paint(el('span', { className: 'mark checker' }), '#fff', layer(t.masterValue, t.step)), el('span', {}, [`${t.master} at ${t.step}%`, far ? el('span', { className: 'moved', textContent: ' · moves a little' }) : null]));
			} else now.append(el('span', { className: 'quiet', textContent: t.why ? `${WORDS[t.kind]}: ${t.why}` : WORDS[t.kind] }));
			const row = el('div', { className: `row${one}` }, [el('div', { className: 'name' }, [el('div', { textContent: t.name }), el('div', { className: 'quiet small', textContent: t.value })]), ...themes.map((th) => bar(t, th)), now]);
			row.dataset.kind = t.kind === 'soft' ? 'soft' : 'solid';
			return row;
		}),
	]);
	list.append(el('div', { className: 'group' }, [el('header', {}, [el('h3', { textContent: g }), el('span', { className: 'quiet', textContent: left === mine.length ? `${mine.length}, unchanged` : `${mine.length} → ${left}` })]), rows]));
}
const filters = el('div', { className: 'filters' }, [['all', `All ${tokens.length}`], ['soft', `Now transparent ${soft.length}`], ['solid', `Unchanged ${solid.length}`]].map(([kind, text], i) => {
	const b = el('button', { className: 'tab', textContent: text, ariaPressed: String(i === 0) });
	b.onclick = () => {
		filters.querySelectorAll('.tab').forEach((x) => (x.ariaPressed = String(x === b)));
		list.querySelectorAll('.row[data-kind]').forEach((r) => (r.hidden = kind !== 'all' && r.dataset.kind !== kind));
		list.querySelectorAll('.group').forEach((gr) => (gr.hidden = !gr.querySelector('.row[data-kind]:not([hidden])')));
	};
	return b;
}));
page.append(el('section', {}, [el('div', { className: 'head' }, [el('div', {}, [el('h2', { textContent: 'Every color' }), el('p', { className: 'quiet', textContent: 'Left half today, right half with hardsoft.' })]), filters]), list]));

document.title = `${system.name}: hardsoft preview`;
</script>
</body>
</html>
